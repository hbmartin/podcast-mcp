[project]
name = "podcast-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "Harold Martin", email = "harold.martin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.0",
    "overcast-to-sqlite>=0.9.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/hbmartin/podcast-mcp"
Repository = "https://github.com/hbmartin/podcast-mcp"
Documentation = "https://hbmartin.github.io/podcast-mcp/"
Changelog = "https://github.com/hbmartin/podcast-mcp/releases"

[project.scripts]
podcast-mcp = "podcast_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "lizard>=1.24.1",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
docs = [
    "zensical>=0.0.50",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.report]
fail_under = 88

[tool.ruff]
# Exclude a variety of commonly ignored directories.
# `/datasets` is anchored to the repository root: a bare `datasets` pattern
# also matches src/legolization/datasets and silently unchecks production code.
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "/datasets", "dist", "node_modules", "papers PDFs", "setup.py", "site-packages", "tools", "venv"]

line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D105", "D107", "D203", "D212", "D213", "EM101", "PLR2004", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ARG001", "ARG002", "ARG005", "D100", "D101", "D102", "D103", "D104", "DTZ003", "ERA001", "F403", "F405", "FBT002", "G004", "N802", "PLC0415", "PLR2004", "PLW1510", "PT011", "PT013", "PTH110", "PTH118", "PTH119", "PTH122", "PTH123", "PTH207", "S101", "S102", "S311", "S603", "S607", "SIM115"]
"scripts/**/*.py" = ["INP001", "T201"]

[tool.pyrefly]
search-path = ["src", "."]
project-includes = [
    "src/**/*.py",
    "scripts/**/*.py",
]

[tool.deptry]
known_first_party = ["podcast_mcp"]
